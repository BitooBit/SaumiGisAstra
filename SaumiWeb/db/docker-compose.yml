# Local Oracle for SaumiWeb — минималка для входа (SAUMI 4.8.5)
# Учётка: SM / smpwd
# gvenzl всегда AL32UTF8 (ORACLE_CHARACTERSET не действует на prebuilt DB).
# Кириллица: схема импортируется с VARCHAR2/CHAR в семантике CHAR (см. import_schema.sh).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: saumiweb-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: smpwd
      APP_USER: SM
      APP_USER_PASSWORD: smpwd
    volumes:
      - saumiweb_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  saumiweb_oracle_data:
